<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1a24">
<meta name="description" content="ONAGER — pick your face, then throw a knight at it.">
<title>ONAGER</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231b1a24'/><path d='M5 26h22M8 26V14h6v12M18 26V9h6v17' stroke='%23e0b25c' stroke-width='2' fill='none' stroke-linejoin='round'/><circle cx='11' cy='6' r='3' fill='%23e0b25c'/></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#0e0d14;color:#e9e2d2;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;overscroll-behavior:none;touch-action:none;
  }
  #stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  #band{width:100%;height:100%}

  /* ---------- boot ---------- */
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:16px;background:#0e0d14;z-index:90;transition:opacity .6s ease;
    text-align:center;padding:24px}
  #boot.gone{opacity:0;pointer-events:none}
  #boot h1{font-size:clamp(30px,8vw,64px);letter-spacing:.4em;font-weight:400;color:#e0b25c;text-indent:.4em}
  #boot p{font-size:12px;letter-spacing:.24em;color:#6b6479;text-transform:uppercase}
  #boot .err{color:#d9603f;letter-spacing:.02em;text-transform:none;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;max-width:74ch;line-height:1.7}
  .spark{width:6px;height:6px;border-radius:50%;background:#e0b25c;
    animation:pulse 1.5s ease-in-out infinite;box-shadow:0 0 16px #e0b25c}
  @keyframes pulse{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.3)}}

  /* ---------- hud ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:20;
    padding:max(18px,env(safe-area-inset-top)) 20px 20px;
    display:flex;flex-direction:column;justify-content:space-between}
  /* A scrim behind the header and the footer. Without it the HUD is legible on
     the dusk themes and invisible on the snow one — pale grey letters on a
     white field. It has to sit BEHIND the content, so it is a pseudo-element on
     #hud rather than a wrapper, and it must not eat pointer events. */
  #hud::before,#hud::after{content:'';position:absolute;left:0;right:0;
    pointer-events:none;z-index:-1}
  #hud::before{top:0;height:190px;
    background:linear-gradient(180deg,rgba(12,10,20,.62),rgba(12,10,20,.34) 42%,transparent)}
  #hud::after{bottom:0;height:180px;
    background:linear-gradient(0deg,rgba(12,10,20,.6),rgba(12,10,20,.28) 46%,transparent)}
  #face,#facesub,.lbl,.num{text-shadow:0 1px 3px rgba(0,0,0,.55)}
  .hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
  .lbl{font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:#7d7590;margin-bottom:6px}

  /* The rack. Not a counter any more: this is WHAT you have left and WHICH one
     is on the arm, because with five kinds of man the choice is the move. */
  #knights{display:flex;gap:5px;align-items:stretch;pointer-events:auto}
  .ktile{width:52px;padding:5px 0 4px;border-radius:5px;cursor:pointer;
    background:rgba(20,17,28,.5);border:1px solid rgba(233,226,210,.14);
    text-align:center;transition:border-color .16s,background .16s,opacity .2s,transform .16s}
  .ktile:hover{background:rgba(34,29,46,.72)}
  .ktile.on{border-color:#e0b25c;background:rgba(60,45,22,.6);
    box-shadow:0 0 0 1px rgba(224,178,92,.4),0 3px 12px rgba(224,178,92,.16)}
  .ktile.out{opacity:.22;cursor:default;transform:scale(.9)}
  .kglyph{width:16px;height:16px;margin:0 auto 3px;
    clip-path:polygon(50% 0,100% 24%,100% 76%,50% 100%,0 76%,0 24%)}
  .kname{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#b8b0c6;
    line-height:1}
  .kct{font-size:12px;color:#e9e2d2;margin-top:2px;line-height:1;font-variant-numeric:tabular-nums}
  .ktile.out .kct{color:#6f6784}
  .kkey{font-size:7px;color:#6f6784;letter-spacing:.1em;margin-top:2px;line-height:1}
  #loadsub{font-size:10px;color:#a79ebc;margin-top:7px;max-width:266px;
    letter-spacing:.02em;line-height:1.5;
    background:rgba(16,13,24,.5);border-left:2px solid rgba(224,178,92,.5);
    border-radius:0 4px 4px 0;padding:6px 9px}
  #loadsub:empty{display:none}

  /* Which castle you are on. Five of them now, and the face name alone does
     not say whether you are at Millbrook or Vantwick. */
  .hleft .lbl{display:flex;align-items:baseline;gap:8px}
  #castleNum{color:#e0b25c;font-size:11px;letter-spacing:.1em}
  #castleName{color:#a79ebc}
  @media (max-width:720px){
    .ktile{width:42px}
    .kkey{display:none}
    #loadsub{display:none}
  }

  /* Soldiers are the objective, so they get the loud pip. */
  /* Twelve pips do not fit one row on a phone, and a row that silently
     overflows reads as a smaller garrison than you actually face. */
  #soldiers{display:flex;flex-wrap:wrap;gap:5px 5px;align-items:center;
    justify-content:flex-end;max-width:min(46vw,260px)}
  .spip{width:13px;height:21px;background:#c4402f;
    clip-path:polygon(50% 0,74% 13%,74% 34%,100% 52%,100% 100%,0 100%,0 52%,26% 34%,26% 13%);
    transition:opacity .3s,transform .35s,background .3s}
  .spip.down{opacity:.2;background:#4a4458;transform:translateY(6px) rotate(76deg)}
  #banners{display:flex;gap:5px;align-items:center;justify-content:flex-end;margin-top:8px}
  .bpip{width:9px;height:12px;background:#8a6a4e;
    clip-path:polygon(0 0,100% 0,100% 100%,50% 74%,0 100%);
    transition:opacity .3s,transform .3s,background .3s}
  .bpip.down{opacity:.9;background:#e0b25c}

  #facewrap{text-align:center;flex:1}
  #face{font-size:clamp(15px,2.4vw,21px);letter-spacing:.2em;text-transform:uppercase;color:#e9e2d2}
  #facesub{font-size:11px;letter-spacing:.08em;color:#b3aac6;margin-top:5px;min-height:15px}

  /* ---------- drag band ---------- */
  /* The slingshot had no visual anchor at all: you dragged in empty space and
     only the arm moved, 30 metres away. The band is the cursor. */
  #band{position:fixed;inset:0;z-index:22;pointer-events:none;opacity:0;
    transition:opacity .12s}
  #band.on{opacity:1}
  #band .cord{stroke:#e0b25c;stroke-width:2.5;stroke-linecap:round;
    filter:drop-shadow(0 0 6px rgba(224,178,92,.55))}
  #band .anchor{fill:none;stroke:rgba(233,226,210,.4);stroke-width:1.5}
  #band .gauge{fill:none;stroke-width:5;stroke-linecap:round;
    transform:rotate(-90deg);transform-origin:center;transition:stroke .12s}
  #band .knob{stroke:#fff;stroke-width:2}
  #readout{position:fixed;z-index:23;pointer-events:none;opacity:0;
    transition:opacity .12s;font-size:12px;letter-spacing:.14em;color:#e9e2d2;
    text-shadow:0 2px 8px rgba(0,0,0,.75);white-space:nowrap;
    font-variant-numeric:tabular-nums;transform:translate(18px,-30px)}
  #readout.on{opacity:1}
  #readout b{color:#e0b25c;font-weight:400}

  #bottom{display:flex;flex-direction:column;align-items:center;gap:9px}
  /* Power is its own control now — it is set once for a face and left alone,
     so it is always on screen rather than only while dragging. */
  .ctlRow{display:flex;align-items:center;gap:12px;pointer-events:auto;opacity:0;
    transition:opacity .2s}
  body.playing .ctlRow{opacity:1}
  .ctlRow .plbl{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:#7d7590;
    min-width:38px}
  .ctlRow .pval{font-size:13px;color:#e0b25c;font-variant-numeric:tabular-nums;min-width:38px;
    text-align:right}
  .elevRow .pval{color:#9fc0d8}
  .pbtn{width:30px;height:30px;border-radius:50%;background:rgba(20,18,28,.5);
    border:1px solid rgba(224,178,92,.4);color:#e0b25c;font:inherit;font-size:17px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;user-select:none;transition:all .12s;flex:none}
  .pbtn:hover,.pbtn:active{background:#e0b25c;color:#1b1a24}
  .trk{width:min(230px,40vw);height:6px;background:rgba(233,226,210,.14);border-radius:3px;
    position:relative}
  #powerfill{position:relative;z-index:2}
  /* The ranges that reach ANYTHING from this bearing. Same language as the
     angle band: gold brackets mean "a shot exists in here". */
  #powBand{position:absolute;top:-4px;bottom:-4px;left:0;width:0;z-index:3;
    pointer-events:none;
    background:rgba(224,178,92,.16);border-left:2px solid rgba(240,200,120,.95);
    border-right:2px solid rgba(240,200,120,.95);border-radius:2px;
    transition:left .18s,width .18s,opacity .2s;opacity:0}
  /* Nothing reaches from here at any range. The answer is to move, so the row
     says so instead of letting you sweep the dial for nothing. */
  #powerRow.nosol .plbl::after{content:' 4 nothing in reach';color:#c8443a;
    letter-spacing:.06em;text-transform:none}
  #powerRow.nosol .plbl{min-width:0;white-space:nowrap;color:#c8443a}
  #powerfill{height:100%;width:0%;background:linear-gradient(90deg,#7fa86a,#e0b25c 55%,#c8443a);
    transition:width .08s linear}
  /* Elevation gets the same treatment as range. It used to be reachable only by
     dragging 280px downward — impossible on a trackpad, and impossible at all
     if you pressed near the bottom of the window. */
  .elevRow{margin-top:9px}
  .elevTrack{position:relative}
  #elevfill{height:100%;width:0%;background:linear-gradient(90deg,#5f8fb8,#9fc0d8);
    transition:width .08s linear;position:relative;z-index:2;border-radius:3px}
  /* The band of angles that actually reach something from here, at this power.
     Painted UNDER the fill, so you can see whether you are inside it. */
  #elevBand{position:absolute;top:-4px;bottom:-4px;left:0;width:0;z-index:3;
    pointer-events:none;
    background:rgba(224,178,92,.16);border-left:2px solid rgba(240,200,120,.95);
    border-right:2px solid rgba(240,200,120,.95);border-radius:2px;
    transition:left .18s,width .18s,opacity .2s;opacity:0}
  #hint{font-size:12px;letter-spacing:.12em;color:#8b83a0;text-align:center;min-height:17px;
    transition:opacity .3s;margin-top:8px}

  /* ---------- compass ---------- */
  #compass{position:fixed;left:50%;transform:translateX(-50%);bottom:146px;z-index:19;
    display:flex;pointer-events:none;opacity:.9}
  .cseg{width:64px;height:4px;background:rgba(233,226,210,.22);margin:0 3px;border-radius:2px;
    transition:background .25s,height .25s}
  .cseg.on{background:#e0b25c;height:5px}

  /* ---------- cards ---------- */
  #card{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:40;
    background:rgba(14,13,20,.82);backdrop-filter:blur(7px);flex-direction:column;gap:18px;
    text-align:center;padding:28px}
  #card.on{display:flex;animation:fade .5s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  #cardTitle{font-size:clamp(30px,7vw,58px);letter-spacing:.24em;color:#e0b25c;text-indent:.24em}
  #cardSub{font-size:13px;letter-spacing:.14em;color:#8b83a0;line-height:2}
  #cardBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px;
    pointer-events:auto}

  #keys{position:fixed;right:20px;bottom:132px;z-index:19;background:rgba(12,10,20,.34);
    padding:8px 12px;border-radius:6px;font-size:11px;letter-spacing:.06em;
    color:#8b8399;text-align:right;line-height:1.9;pointer-events:none;
    text-shadow:0 1px 3px rgba(0,0,0,.55)}
  #keys b{color:#d6cfe4;font-weight:400;font-family:ui-monospace,Menlo,Consolas,monospace}

  /* ---------- title ---------- */
  #title{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
    align-items:center;justify-content:space-between;text-align:center;
    padding:clamp(20px,5vh,60px) 24px clamp(24px,6vh,70px);
    background:radial-gradient(ellipse at 50% 52%,rgba(14,13,20,0) 22%,rgba(14,13,20,.5) 62%,rgba(14,13,20,.86) 100%);
    transition:opacity .55s ease}
  #title.gone{opacity:0;pointer-events:none}
  #title h1{font-size:clamp(38px,10vw,104px);letter-spacing:.34em;font-weight:400;
    color:#f0d9a8;text-indent:.34em;text-shadow:0 6px 34px rgba(0,0,0,.7);line-height:1}
  #title .tag{margin-top:14px;font-size:clamp(12px,2.2vw,15px);letter-spacing:.2em;
    color:#cbbfa6;text-shadow:0 2px 12px rgba(0,0,0,.8)}
  #title .rule{width:min(320px,60vw);height:1px;background:linear-gradient(90deg,
    transparent,rgba(224,178,92,.65),transparent);margin:18px auto 0}
  #titleTop{display:flex;flex-direction:column;align-items:center}
  #titleBottom{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%}
  #titleBtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

  /* ---------- level picker ---------- */
  #levels{display:flex;flex-direction:column;gap:7px;width:min(430px,92vw);pointer-events:auto}
  .lvl{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
    background:rgba(14,13,20,.5);border:1px solid rgba(224,178,92,.28);
    color:#e9e2d2;font:inherit;padding:11px 15px;backdrop-filter:blur(3px);
    transition:background .16s,border-color .16s,transform .16s}
  .lvl:hover{background:rgba(224,178,92,.16);border-color:rgba(224,178,92,.7);transform:translateX(2px)}
  .lvl.locked{opacity:.42;cursor:default;border-color:rgba(233,226,210,.14)}
  .lvl.locked:hover{background:rgba(14,13,20,.5);border-color:rgba(233,226,210,.14);transform:none}
  .lvl .n{flex:none;width:24px;font-size:19px;color:#e0b25c;text-align:center;
    font-variant-numeric:tabular-nums}
  .lvl .t{flex:1;font-size:14px;letter-spacing:.06em;line-height:1.35}
  .lvl .t em{display:block;font-style:normal;font-size:11px;color:#8b83a0;letter-spacing:.04em;
    margin-top:2px}
  .lvl .s{flex:none;font-size:12px;color:#8b83a0;font-variant-numeric:tabular-nums}
  .tbtn{pointer-events:auto;background:rgba(14,13,20,.45);border:1px solid rgba(224,178,92,.65);
    color:#e0b25c;font:inherit;font-size:13px;letter-spacing:.24em;text-transform:uppercase;
    padding:14px 34px;cursor:pointer;transition:background .18s,color .18s,transform .18s;
    backdrop-filter:blur(3px)}
  .tbtn:hover{background:#e0b25c;color:#1b1a24;transform:translateY(-1px)}
  .tbtn.ghost{border-color:rgba(233,226,210,.3);color:#cbbfa6}
  .tbtn.ghost:hover{background:rgba(233,226,210,.9);color:#1b1a24}

  /* ---------- panel (settings / how to play) ---------- */
  #panel{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
    background:rgba(10,9,14,.82);backdrop-filter:blur(8px);padding:20px}
  #panel.on{display:flex}
  .sheet{width:min(560px,94vw);max-height:88vh;overflow-y:auto;
    background:rgba(22,20,30,.96);border:1px solid rgba(224,178,92,.28);padding:26px 28px}
  .sheet h2{font-size:15px;letter-spacing:.28em;text-transform:uppercase;color:#e0b25c;
    margin-bottom:18px;font-weight:400}
  .sheet h3{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#7d7590;
    margin:20px 0 8px;font-weight:400}
  .row{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:9px 0;border-bottom:1px solid rgba(233,226,210,.07)}
  .row label{font-size:13px;color:#cbbfa6;letter-spacing:.05em}
  .row .sub{display:block;font-size:11px;color:#6b6479;letter-spacing:.02em;margin-top:2px}
  .seg{display:flex;gap:2px}
  .seg button{background:none;border:1px solid rgba(233,226,210,.2);color:#8b83a0;
    font:inherit;font-size:11px;letter-spacing:.1em;padding:6px 11px;cursor:pointer;
    text-transform:uppercase;transition:all .15s}
  .seg button.on{background:#e0b25c;border-color:#e0b25c;color:#1b1a24}
  .sw{width:46px;height:24px;border-radius:12px;background:rgba(233,226,210,.16);
    border:none;cursor:pointer;position:relative;transition:background .18s;flex:none}
  .sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;
    border-radius:50%;background:#8b83a0;transition:transform .18s,background .18s}
  .sw.on{background:rgba(224,178,92,.4)}
  .sw.on::after{transform:translateX(22px);background:#e0b25c}
  input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:3px;
    background:rgba(233,226,210,.2);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
    border-radius:50%;background:#e0b25c;cursor:pointer}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;
    background:#e0b25c;cursor:pointer}
  .sheetFoot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
  .howRow{display:flex;gap:14px;padding:10px 0;align-items:flex-start;
    border-bottom:1px solid rgba(233,226,210,.07)}
  .howRow kbd{flex:none;min-width:74px;text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11px;color:#e0b25c;border:1px solid rgba(224,178,92,.35);padding:5px 8px;
    letter-spacing:.06em}
  .howRow div{font-size:13px;color:#cbbfa6;line-height:1.6}
  .howRow b{color:#e9e2d2;font-weight:400}

  /* ---------- mobile controls ---------- */
  #touch{position:fixed;inset:0;z-index:21;pointer-events:none;display:none}
  body.touch #touch{display:block}
  body.touch #keys{display:none}
  .tc{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));
    width:62px;height:62px;border-radius:50%;pointer-events:auto;
    background:rgba(20,18,28,.5);border:1px solid rgba(224,178,92,.45);
    color:#e0b25c;font-size:22px;display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(4px);-webkit-tap-highlight-color:transparent;user-select:none;
    transition:background .12s,transform .12s}
  .tc:active,.tc.held{background:rgba(224,178,92,.8);color:#1b1a24;transform:scale(.94)}
  #tcL{left:calc(16px + env(safe-area-inset-left))}
  #tcR{left:calc(90px + env(safe-area-inset-left))}
  #tcDive{right:calc(16px + env(safe-area-inset-right));width:76px;height:76px;
    font-size:11px;letter-spacing:.12em;bottom:calc(20px + env(safe-area-inset-bottom))}
  body.lefty #tcL{left:auto;right:calc(90px + env(safe-area-inset-right))}
  body.lefty #tcR{left:auto;right:calc(16px + env(safe-area-inset-right))}
  body.lefty #tcDive{right:auto;left:calc(16px + env(safe-area-inset-left))}
  /* The settings cog and the view chip live IN the header column now. As
     free-floating fixed elements they landed on top of the word GARRISON at
     every width above 640px. */
  .hctl{display:flex;gap:6px;align-items:center;justify-content:flex-end;
    margin-bottom:9px;pointer-events:auto}
  #gear{width:28px;height:28px;flex:none;
    border-radius:50%;background:rgba(20,18,28,.55);border:1px solid rgba(233,226,210,.16);
    color:#cbbfa6;cursor:pointer;font-size:13px;display:flex;align-items:center;
    justify-content:center;transition:all .15s;padding:0}
  #gear:hover{background:rgba(224,178,92,.85);color:#1b1a24;border-color:#e0b25c}

  body.pregame #hud,body.pregame #compass,body.pregame #keys,body.pregame #touch{
    opacity:0;pointer-events:none}

  /* Nine knight pips plus nine garrison pips plus two labels plus the gear do
     not fit across 375px — the garrison row ran off the edge and under the
     gear. Narrow screens get numerals instead. */
  .num{display:none;font-size:19px;letter-spacing:.06em;color:#e9e2d2;
    font-variant-numeric:tabular-nums;line-height:1}
  .num i{font-style:normal;color:#6b6479;font-size:13px}
  #soldiersNum{text-align:right;color:#e08a78}

  @media (max-width:640px){ #keys{display:none} .cseg{width:40px}
    #hud{padding:max(12px,env(safe-area-inset-top)) 12px 12px}
    #knights,#soldiers{display:none}
    .num{display:block}
    #banners{margin-top:5px}
    .bpip{width:8px;height:11px}
    #facewrap{padding:0 6px}
    #face{font-size:14px} #facesub{font-size:10px}
    #bottom{padding-bottom:96px}
    #compass{bottom:176px}
  }

  /* ---------- the workshop ---------- */
  /* A full-screen editor, not a panel: a castle plan needs the whole window,
     and the game behind it is irrelevant while you are building. */
  #workshop{position:fixed;inset:0;z-index:70;background:#0d0b14;
    display:none;flex-direction:column;overflow:auto;
    padding:max(18px,env(safe-area-inset-top)) 20px 20px}
  #workshop.on{display:flex}
  #workshop h2{font-size:15px;letter-spacing:.24em;text-transform:uppercase;
    color:#e0b25c;margin:0 0 8px}
  .wsHead{display:flex;justify-content:space-between;align-items:flex-start;
    gap:20px;flex-wrap:wrap;margin-bottom:16px}
  .wsHead .lead{max-width:520px}
  .wsHeadBtns{display:flex;gap:8px;flex-wrap:wrap}
  .wsTabs{display:flex;gap:6px;margin-bottom:14px}
  .wsTabs button{background:none;border:1px solid rgba(233,226,210,.16);color:#8b83a0;
    font:inherit;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    padding:7px 14px;border-radius:5px;cursor:pointer}
  .wsTabs button.on{border-color:#e0b25c;color:#e9e2d2;background:rgba(60,45,22,.42)}
  .wsGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:10px}
  .wsCard{background:rgba(255,255,255,.03);border:1px solid rgba(233,226,210,.12);
    border-radius:7px;padding:12px 13px}
  .wsCardName{font-size:13px;color:#e9e2d2;letter-spacing:.06em}
  .wsCardSub{font-size:11px;color:#8b83a0;margin-top:5px;line-height:1.5}
  .wsCardBtns{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}
  .wsCardBtns button,.wsPropBtns button{background:none;border:1px solid rgba(233,226,210,.18);
    color:#b8b0c6;font:inherit;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:5px 9px;border-radius:4px;cursor:pointer}
  .wsCardBtns button:hover,.wsPropBtns button:hover{border-color:#e0b25c;color:#e9e2d2}
  .wsCardBtns .danger:hover,.wsPropBtns .danger:hover{border-color:#c8443a;color:#ff8f7a}
  .wsEmpty{color:#8b83a0;font-size:13px}
  .wsPackMake{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}

  .wsEdHead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .wsEdBtns{display:flex;gap:8px;margin-left:auto}
  #wsName,#wsAuthor,#wsPackName{
    background:rgba(255,255,255,.04);border:1px solid rgba(233,226,210,.16);
    border-radius:5px;color:#e9e2d2;font:inherit;font-size:13px;padding:8px 11px}
  #wsName{min-width:220px}

  .wsBody{display:grid;grid-template-columns:186px 1fr 232px;gap:12px;
    align-items:stretch;min-height:0}
  .wsPal{display:flex;flex-direction:column;gap:5px;overflow:auto}
  .wsPalTitle,.wsPropTitle{font-size:9px;letter-spacing:.24em;text-transform:uppercase;
    color:#7d7590;margin-bottom:4px}
  .wsPropTitle.mt{margin-top:16px}
  .wsPiece{text-align:left;background:rgba(255,255,255,.03);
    border:1px solid rgba(233,226,210,.12);border-radius:6px;padding:8px 10px;
    cursor:pointer;font:inherit;color:inherit}
  .wsPiece:hover{background:rgba(255,255,255,.06)}
  .wsPiece.on{border-color:#e0b25c;background:rgba(60,45,22,.5)}
  .wsPieceName{display:block;font-size:12px;color:#e9e2d2;letter-spacing:.06em}
  .wsPieceHint{display:block;font-size:10px;color:#7d7590;line-height:1.4;margin-top:3px}

  .wsPlanWrap{display:flex;flex-direction:column;min-width:0}
  #wsCanvas{width:100%;height:clamp(320px,54vh,620px);border-radius:8px;
    border:1px solid rgba(233,226,210,.12);display:block;touch-action:none}
  .wsPlanFoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-size:10.5px;color:#7d7590;margin-top:7px}
  .wsKeys b{color:#b8b0c6;font-weight:400}

  .wsProps{overflow:auto;max-height:clamp(320px,54vh,620px);padding-right:4px}
  .wsRow{display:flex;justify-content:space-between;align-items:center;gap:8px;
    font-size:11.5px;color:#b8b0c6;padding:4px 0}
  .wsRow input[type=number],.wsRow select{width:92px;background:rgba(255,255,255,.05);
    border:1px solid rgba(233,226,210,.16);border-radius:4px;color:#e9e2d2;
    font:inherit;font-size:12px;padding:4px 7px}
  .wsRow input[type=checkbox]{width:16px;height:16px;accent-color:#e0b25c}
  .wsHint{font-size:10.5px;color:#7d7590;line-height:1.5;margin:6px 0 0}
  .wsNone{font-size:11.5px;color:#7d7590;line-height:1.5}
  .wsPropBtns{display:flex;gap:6px;margin-top:10px}

  .wsChecks{margin-top:14px;background:rgba(255,255,255,.025);
    border:1px solid rgba(233,226,210,.1);border-radius:7px;padding:12px 14px}
  .wsChecksHead{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .wsChecksHead b{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#7d7590;
    font-weight:400}
  .wsChecks ul{list-style:none;padding:0;margin:9px 0 0}
  .wsChecks li{font-size:11.5px;color:#b8b0c6;line-height:1.6;padding-left:16px;position:relative}
  .wsChecks li::before{content:"\25B8";position:absolute;left:0;color:#7d7590}
  .wsChecks li.bad{color:#ff8f7a}
  .wsChecks li.bad::before{content:"\2715";color:#c8443a}
  .wsChecks li.good{color:#9fd0a0}
  .wsChecks li.good::before{content:"\2713";color:#6fa870}
  .wsVerdict{margin-top:10px;border-top:1px solid rgba(233,226,210,.1);padding-top:9px}
  .wsVerdict b{font-size:11px;letter-spacing:.2em;text-transform:uppercase}
  .wsVerdict.good b{color:#9fd0a0}
  .wsVerdict.bad b{color:#ff8f7a}
  .wsBusy{font-size:11.5px;color:#7d7590}

  #linkBox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:80;
    width:min(540px,calc(100vw - 40px));background:#161320;
    border:1px solid rgba(224,178,92,.34);border-radius:9px;padding:18px 20px;
    display:none;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #linkBox.on{display:block}
  #linkBox p{font-size:12.5px;color:#ded7ca;margin:0 0 10px}
  #linkBox textarea{width:100%;background:rgba(255,255,255,.05);
    border:1px solid rgba(233,226,210,.16);border-radius:5px;color:#e9e2d2;
    font:12px ui-monospace,Menlo,Consolas,monospace;padding:9px;resize:vertical}
  #linkBox button{margin-top:11px}

  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);
    z-index:90;background:rgba(16,13,24,.94);border:1px solid rgba(224,178,92,.4);
    border-radius:6px;padding:10px 16px;font-size:12.5px;color:#f0e4c8;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    max-width:calc(100vw - 40px);text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:900px){
    .wsBody{grid-template-columns:1fr}
    .wsPal{flex-direction:row;flex-wrap:wrap}
    .wsPiece{flex:1 1 140px}
    .wsPieceHint{display:none}
    .wsProps{max-height:none}
  }

  /* ---------- the garrison book ---------- */
  /* The portrait is a live model, not a picture. Size is the only tell for
     what a Serjeant will do to a Lance, and a still image does not carry it. */
  .lead{font-size:12px;color:#8b83a0;margin:-4px 0 14px;letter-spacing:.02em}
  .rosterWrap{display:flex;gap:18px;align-items:stretch}
  .foeList{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
  .foeRow{display:grid;grid-template-columns:12px 1fr;grid-template-rows:auto auto;
    gap:2px 10px;align-items:center;text-align:left;cursor:pointer;
    background:rgba(255,255,255,.02);border:1px solid rgba(233,226,210,.1);
    border-radius:6px;padding:9px 11px;font:inherit;color:inherit;
    transition:border-color .16s,background .16s}
  .foeRow:hover{background:rgba(255,255,255,.05)}
  .foeRow.on{border-color:#e0b25c;background:rgba(60,45,22,.42)}
  .foeRow i{grid-row:1/3;width:12px;height:12px;border-radius:50%;display:block}
  .foeRow .fname{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:#e9e2d2}
  .foeRow .fsub{font-size:11px;color:#8b83a0;line-height:1.4}
  .foeStage{flex:none;width:262px;display:flex;flex-direction:column;
    background:linear-gradient(180deg,rgba(46,52,70,.55),rgba(18,15,26,.72));
    border:1px solid rgba(233,226,210,.1);border-radius:7px;overflow:hidden}
  #foeCanvas{width:100%;height:230px;display:block}
  .foeCard{padding:11px 13px 13px;border-top:1px solid rgba(233,226,210,.09)}
  .fcName{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#e0b25c}
  .fcRole{font-size:11.5px;color:#cbbfa6;line-height:1.55;margin-top:7px}
  .fcStats{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .fcStats span{font-size:9px;letter-spacing:.11em;text-transform:uppercase;
    color:#b8b0c6;border:1px solid rgba(233,226,210,.16);border-radius:3px;padding:3px 6px}
  .fcStats span.beat{color:#f0d69a;border-color:rgba(224,178,92,.42);
    background:rgba(224,178,92,.09)}
  @media (max-width:660px){
    .rosterWrap{flex-direction:column-reverse}
    .foeStage{width:100%}
    #foeCanvas{height:190px}
  }

  /* ---------- view chip ---------- */
  #viewChip{display:flex;
    align-items:center;gap:6px;padding:5px 9px;border-radius:16px;cursor:pointer;
    background:rgba(20,17,28,.55);border:1px solid rgba(233,226,210,.16);
    color:#c9c1d4;font:inherit;font-size:9px;letter-spacing:.15em;
    text-transform:uppercase;transition:border-color .16s,color .16s}
  #viewChip:hover{border-color:#e0b25c;color:#e9e2d2}
  #viewChip .veye{color:#e0b25c;font-size:9px}
  #viewChip b{font-weight:400;font-size:8px;color:#6f6784;border:1px solid rgba(233,226,210,.18);
    border-radius:3px;padding:1px 4px;letter-spacing:.06em}
  #viewChip.flash{animation:viewflash .45s ease-out}
  @keyframes viewflash{0%{border-color:#e0b25c;background:rgba(60,45,22,.75)}
    100%{border-color:rgba(233,226,210,.16);background:rgba(20,17,28,.66)}}
  @media (max-width:720px){ #viewChip b{display:none} }

  /* ---------- guided first siege ---------- */
  /* One verb at a time, and it waits for you to do it. Sits above the power
     row so it never covers the thing the current step is telling you to use. */
  #coach{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);
    bottom:176px;z-index:24;width:min(430px,calc(100vw - 36px));
    background:rgba(16,13,24,.9);border:1px solid rgba(224,178,92,.34);
    border-radius:9px;padding:13px 15px 11px;pointer-events:auto;
    box-shadow:0 10px 34px rgba(0,0,0,.5);opacity:0;visibility:hidden;
    transition:opacity .22s,transform .22s,visibility .22s}
  #coach.on{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
  #coach.idle{opacity:.4}
  #coach.pop{animation:coachpop .3s ease-out}
  @keyframes coachpop{0%{transform:translateX(-50%) translateY(7px);opacity:.3}
    100%{transform:translateX(-50%) translateY(0);opacity:1}}
  #coachTitle{font-size:10px;letter-spacing:.24em;text-transform:uppercase;
    color:#e0b25c;margin-bottom:7px}
  #coachBody{font-size:13px;line-height:1.5;color:#ded7ca}
  /* The instruction, separated from the explanation. On a second read this is
     the only line you need, so it gets its own plate. */
  #coachAsk{display:flex;align-items:center;gap:9px;margin-top:11px;
    background:rgba(224,178,92,.11);border:1px solid rgba(224,178,92,.3);
    border-radius:6px;padding:8px 11px;font-size:12.5px;color:#f0e4c8}
  #coachAsk .do{font-size:8px;letter-spacing:.2em;text-transform:uppercase;
    color:#1b1a24;background:#e0b25c;border-radius:3px;padding:3px 6px;flex:none}
  #coachAsk b{color:#fff;background:rgba(255,255,255,.14);border-radius:3px;
    padding:1px 6px;font-weight:600}
  #coachNext.go{background:#e0b25c;color:#1b1a24;border-color:#e0b25c}

  /* The pointer. A ring on the actual control the step is talking about —
     without it the whole thing reads as a menu you are meant to read rather
     than a hand showing you where to look. */
  #coachHalo{position:fixed;z-index:23;pointer-events:none;opacity:0;
    border:2px solid #e0b25c;box-shadow:0 0 0 3px rgba(224,178,92,.14),
      0 0 22px rgba(224,178,92,.35), inset 0 0 18px rgba(224,178,92,.12);
    transition:left .22s cubic-bezier(.2,.8,.3,1),top .22s cubic-bezier(.2,.8,.3,1),
      width .22s,height .22s,opacity .2s}
  #coachHalo.on{opacity:1;animation:haloPulse 1.8s ease-in-out infinite}
  @keyframes haloPulse{0%,100%{box-shadow:0 0 0 3px rgba(224,178,92,.12),
      0 0 18px rgba(224,178,92,.28),inset 0 0 14px rgba(224,178,92,.10)}
    50%{box-shadow:0 0 0 5px rgba(224,178,92,.22),
      0 0 30px rgba(224,178,92,.5),inset 0 0 22px rgba(224,178,92,.18)}}
  @media (prefers-reduced-motion:reduce){ #coachHalo.on{animation:none} }
  #coachBody b{color:#fff;background:rgba(224,178,92,.17);border-radius:3px;
    padding:1px 5px;font-weight:600}
  #coachFoot{display:flex;justify-content:space-between;align-items:center;
    margin-top:11px}
  #coachDots{display:flex;gap:5px}
  #coachDots i{width:5px;height:5px;border-radius:50%;background:rgba(233,226,210,.2);
    transition:background .2s,transform .2s}
  #coachDots i.was{background:rgba(224,178,92,.45)}
  #coachDots i.is{background:#e0b25c;transform:scale(1.5)}
  #coachNext{background:none;border:1px solid rgba(233,226,210,.24);color:#b8b0c6;
    font:inherit;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    padding:5px 12px;border-radius:4px;cursor:pointer}
  #coachNext:hover{border-color:#e0b25c;color:#e9e2d2}
  body.coaching #keys{opacity:0}
  @media (max-width:720px){ #coach{bottom:196px} }
  @media (prefers-reduced-motion:reduce){ #coach.pop{animation:none} }
  @media (prefers-reduced-motion:reduce){ .spark{animation:none;opacity:.7} }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="hud">
  <div class="hrow">
    <div class="hleft">
      <div class="lbl"><span id="castleNum"></span><span id="castleName"></span></div>
      <div id="knights"></div>
      <div class="num" id="knightsNum"></div>
      <div id="loadsub"></div>
    </div>
    <div id="facewrap">
      <div id="face">&mdash;</div>
      <div id="facesub"></div>
    </div>
    <div class="hright">
      <div class="hctl">
        <button id="viewChip" title="Change view (C)"><span class="veye">&#9673;</span><span id="viewName">Siege</span><b>C</b></button>
        <button id="gear" title="Settings">&#9881;</button>
      </div>
      <div class="lbl" style="text-align:right">Garrison</div>
      <div id="soldiers"></div>
      <div class="num" id="soldiersNum"></div>
      <div id="banners" title="standards taken"></div>
    </div>
  </div>
  <div id="bottom">
    <div class="ctlRow" id="powerRow">
      <span class="plbl">Range</span>
      <button class="pbtn" id="powDown">&minus;</button>
      <div class="trk" id="power"><div id="powBand"></div><div id="powerfill"></div></div>
      <button class="pbtn" id="powUp">+</button>
      <span class="pval" id="powVal">80%</span>
    </div>
    <div class="ctlRow elevRow">
      <span class="plbl">Angle</span>
      <button class="pbtn" id="elevDown">&minus;</button>
      <div class="trk elevTrack"><div id="elevBand"></div><div id="elevfill"></div></div>
      <button class="pbtn" id="elevUp">+</button>
      <span class="pval" id="elevVal">20&deg;</span>
    </div>
    <div id="hint"></div>
  </div>
</div>

<div id="coachHalo"></div>
<div id="coach">
  <div id="coachTitle"></div>
  <div id="coachBody"></div>
  <div id="coachAsk"></div>
  <div id="coachFoot">
    <div id="coachDots"></div>
    <button id="coachNext">Skip</button>
  </div>
</div>

<svg id="band" xmlns="http://www.w3.org/2000/svg">
  <circle class="anchor" id="bandRing" r="26"/>
  <circle class="gauge" id="bandTrack" r="34" stroke="rgba(233,226,210,.16)"/>
  <circle class="gauge" id="bandFill" r="34"/>
  <line class="cord" id="bandCord"/>
  <circle class="knob" id="bandKnob" r="7" fill="#e0b25c"/>
</svg>
<div id="readout"></div>

<div id="compass"></div>

<div id="keys">
  <div><b>A</b> / <b>D</b> &mdash; circle the fortress</div>
  <div><b>drag</b> &mdash; aim: sideways swings, down lifts</div>
  <div><b>wheel</b> / <b>W</b> <b>S</b> &mdash; range</div>
  <div><b>space</b> &mdash; lance dive, in flight</div>
  <div><b>R</b> &mdash; restart</div>
</div>

<div id="card">
  <div id="cardTitle">CLEARED</div>
  <div id="cardSub"></div>
  <div id="cardBtns"></div>
</div>

<div id="touch">
  <div class="tc" id="tcL">&#8249;</div>
  <div class="tc" id="tcR">&#8250;</div>
  <div class="tc" id="tcDive">DIVE</div>
</div>


<div id="title">
  <div id="titleTop">
    <h1>ONAGER</h1>
    <div class="tag">Pick your face, then throw a knight at it</div>
    <div class="rule"></div>
  </div>
  <div id="titleBottom">
    <div id="levels"></div>
    <div id="titleBtns">
      <button class="tbtn" id="btnPlay">Begin the siege</button>
      <button class="tbtn ghost" id="btnHow">How to play</button>
      <button class="tbtn ghost" id="btnFoes">The garrison</button>
      <button class="tbtn ghost" id="btnWorkshop">Build a castle</button>
      <button class="tbtn ghost" id="btnSet">Settings</button>
    </div>
  </div>
</div>

<div id="panel"><div class="sheet" id="sheet"></div></div>

<div id="workshop">
  <div id="wsShelf"></div>
  <div id="wsEditor" style="display:none"></div>
</div>
<div id="linkBox"></div>
<div id="toast"></div>

<div id="boot">
  <h1>ONAGER</h1>
  <div class="spark"></div>
  <p id="bootmsg">Winding the arm</p>
</div>

<script>
  // Boot watchdog. A dead title screen is the most common failure mode for
  // these builds - say so loudly instead of showing an elegant black rectangle.
  window.__OK = false;
  window.__fail = function (why) {
    var b = document.getElementById('boot'), m = document.getElementById('bootmsg');
    if (!b || !m) return;
    b.classList.remove('gone'); b.style.opacity = '1'; b.style.pointerEvents = 'auto';
    m.className = 'err'; m.textContent = 'Failed to start - ' + why;
    var s = b.querySelector('.spark'); if (s) s.style.display = 'none';
  };
  window.addEventListener('error', function (e) {
    if (!window.__OK) window.__fail((e.message || 'script error') +
      (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    if (!window.__OK) window.__fail('' + ((e.reason && e.reason.message) || e.reason));
  });
  setTimeout(function () {
    if (!window.__OK) window.__fail('nothing rendered after 20s. Check the console.');
  }, 20000);
</script>

<script type="module" src="src/main.js?v=0.1.0"></script>
</body>
</html>
